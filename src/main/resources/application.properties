# ---------------------------------------------------------------
# Billing System settings.  Only the 3 datasource lines usually need changing.
# ---------------------------------------------------------------
spring.application.name=billing-system
server.port=8080

# MySQL connection. The database "billing_spring" is created automatically if it does not exist.
spring.datasource.url=jdbc:mysql://localhost:3306/billing_spring?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate creates / updates the tables (users, items, sales) for you.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Re-read HTML templates on every request while developing.
spring.thymeleaf.cache=false

# true = add 4 sample items and 3 sample sales the first time the app starts on an empty database.
# Set to false if you want to start completely empty.
billing.seed-sample-data=true
