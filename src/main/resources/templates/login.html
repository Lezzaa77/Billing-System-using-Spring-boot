<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <h2>Login</h2>
    <div class="success" th:if="${param.registered}">Account created. Please log in.</div>
    <div class="success" th:if="${param.logout}">You have been logged out.</div>
    <div class="error" th:if="${param.error}">Invalid email or password.</div>

    <form th:action="@{/login}" method="post">
        <label for="username">Email</label>
        <input type="email" id="username" name="username" required autofocus>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Login</button>
    </form>
    <p class="small">No account? <a th:href="@{/signup}">Sign up</a></p>
</div>
</body>
</html>
