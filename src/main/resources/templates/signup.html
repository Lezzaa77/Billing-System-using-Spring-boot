<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign Up')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <h2>Sign Up</h2>

    <form th:action="@{/signup}" th:object="${form}" method="post">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" th:field="*{fullName}" maxlength="100">
        <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">error</div>

        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" maxlength="120">
        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">error</div>

        <label for="password">Password (at least 6 characters)</label>
        <input type="password" id="password" th:field="*{password}">
        <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">error</div>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}">
        <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">error</div>

        <button type="submit">Create Account</button>
        <a class="btn btn-gray" th:href="@{/login}">Back to Login</a>
    </form>
</div>
</body>
</html>
