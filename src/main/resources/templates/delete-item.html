<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Delete Item')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <h2>Delete Item</h2>
    <p>Are you sure you want to delete this item? This cannot be undone. Past sales of this item stay in the sales report.</p>

    <table>
        <tr><th>Item ID</th><td th:text="${item.itemCode}">ITM001</td></tr>
        <tr><th>Name</th><td th:text="${item.name}">Name</td></tr>
        <tr><th>Category</th><td th:text="${item.categoryLabel}">Category</td></tr>
        <tr><th>Quantity</th><td th:text="${item.quantity}">0</td></tr>
        <tr><th>Unit Price</th><td th:text="${#numbers.formatDecimal(item.unitPrice, 1, 'COMMA', 2, 'POINT')}">0.00</td></tr>
    </table>

    <form th:action="@{/items/{id}/delete(id=${item.id})}" method="post">
        <button type="submit" class="btn-danger">Yes, Delete</button>
        <a class="btn btn-gray" th:href="@{/home}">Back to Home</a>
    </form>
</div>
</body>
</html>
